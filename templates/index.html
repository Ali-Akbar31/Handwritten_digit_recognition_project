<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Number Recognizer</title>
    <style>
        /* CSS Same as before to keep design unchanged */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .main-container { max-width: 1200px; margin: 0 auto; background: rgba(255, 255, 255, 0.95); border-radius: 20px; padding: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 3em; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .navigation { display: flex; justify-content: center; gap: 20px; margin-bottom: 40px; }
        .nav-btn { padding: 15px 30px; border: none; border-radius: 50px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; cursor: pointer; transition: 0.3s; }
        .nav-btn:hover { transform: translateY(-3px); }
        .tab-content { display: none; animation: fadeIn 0.5s ease; }
        .tab-content.active { display: block; }
        .tab-section { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        .upload-area { border: 3px dashed #667eea; border-radius: 15px; padding: 40px; cursor: pointer; margin-bottom: 20px;}
        .upload-area:hover { background: #f8f9fa; }
        #drawingCanvas { border: 3px solid #2c3e50; border-radius: 15px; cursor: crosshair; background: #000; margin-bottom: 20px; }
        .drawing-controls { display: flex; gap: 15px; justify-content: center; }
        .control-btn { padding: 12px 25px; border: none; border-radius: 25px; background: #34495e; color: white; cursor: pointer; }
        .control-btn:hover { background: #2c3e50; }
        .result-display { margin-top: 30px; padding: 25px; border-radius: 15px; font-weight: bold; }
        .success-result { background: #d4edda; color: #155724; border: 2px solid #c3e6cb; }
        .error-result { background: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; }
        .prediction-digit { font-size: 4em; color: #667eea; }
        .confidence-bar { width: 100%; height: 20px; background: #ecf0f1; border-radius: 10px; margin: 15px 0; overflow: hidden; }
        .confidence-fill { height: 100%; background: linear-gradient(135deg, #667eea, #764ba2); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header">
            <h1>Handwritten digit recognition</h1>
            <p>Advanced AI-powered digit classification system</p>
        </div>

        <div class="navigation">
            <button class="nav-btn" onclick="switchTab('uploadTab')">📁 Upload Image</button>
            <button class="nav-btn" onclick="switchTab('drawTab')">✏️ Draw Digit</button>
            <button class="nav-btn" onclick="window.location.href='/prediction_history'">📊 View History</button>
        </div>

        <div id="uploadTab" class="tab-content active">
            <div class="tab-section">
                <h2>Image Upload</h2>
                <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                    <h3>Click to Upload Image</h3>
                    <input type="file" id="fileInput" accept="image/*" style="display: none;">
                </div>
                <button class="control-btn" onclick="processUpload()">Analyze Image</button>
                <div id="uploadResult" class="result-display"></div>
            </div>
        </div>

        <div id="drawTab" class="tab-content">
            <div class="tab-section">
                <h2>Draw a Digit</h2>
                <canvas id="drawingCanvas" width="400" height="400"></canvas>
                <div class="drawing-controls">
                    <button class="control-btn" onclick="clearDrawing()">Clear Canvas</button>
                    <button class="control-btn" onclick="analyzeDrawing()">Analyze Drawing</button>
                </div>
                <div id="drawResult" class="result-display"></div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
        }

        // --- Simple Drawing Logic ---
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        // Setup Canvas
        ctx.fillStyle = '#000'; // Black Background
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Fixed Brush Settings
        ctx.strokeStyle = '#ffffff'; // White pen
        ctx.lineWidth = 15;          // Fixed Size
        ctx.lineCap = 'round';

        // Mouse/Touch Events
        canvas.addEventListener('mousedown', start);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stop);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); start(e.touches[0]); });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e.touches[0]); });
        canvas.addEventListener('touchend', stop);

        function start(e) {
            isDrawing = true;
            draw(e);
        }

        function draw(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.pageX) - rect.left;
            const y = (e.clientY || e.pageY) - rect.top;
            
            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        function stop() {
            isDrawing = false;
            ctx.beginPath();
        }

        function clearDrawing() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            document.getElementById('drawResult').innerHTML = '';
            document.getElementById('drawResult').className = 'result-display';
        }

        // --- API Calls ---
        async function sendPrediction(url, bodyData, resultId) {
            const resultEl = document.getElementById(resultId);
            resultEl.innerHTML = 'Analyzing...';
            resultEl.className = 'result-display';

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: !bodyData.entries ? {'Content-Type': 'application/json'} : {},
                    body: bodyData
                });
                const data = await response.json();
                
                if (data.success) {
                    resultEl.innerHTML = `
                        <div class="prediction-digit">${data.digit}</div>
                        <p>Confidence: ${data.confidence}%</p>
                        <div class="confidence-bar"><div class="confidence-fill" style="width: ${data.confidence}%"></div></div>`;
                    resultEl.className = 'result-display success-result';
                } else {
                    throw new Error(data.error);
                }
            } catch (err) {
                resultEl.innerHTML = 'Error: ' + err.message;
                resultEl.className = 'result-display error-result';
            }
        }

        function analyzeDrawing() {
            sendPrediction('/drawing_prediction', JSON.stringify({ canvas_data: canvas.toDataURL() }), 'drawResult');
        }

        function processUpload() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return alert("Please select a file first");
            const formData = new FormData();
            formData.append('image_file', file);
            sendPrediction('/upload_prediction', formData, 'uploadResult');
        }
    </script>
</body>
</html>
